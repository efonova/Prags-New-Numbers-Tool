<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeeva Yoga Studio</title>
<style>
  :root {
    --bg: #fbf9ec;
    --card: #ffffff;
    --ink: #1d2a22;
    --muted: #7a6149;
    --line: #e2dcc4;
    --accent: #11712a;
    --accent-soft: #e4eedb;
    --input: #d6e7d2;
    --input-line: #91b692;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid var(--line); }
  .tab {
    border: 0; background: none; font: inherit; color: var(--muted);
    padding: 10px 18px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; margin-bottom: 22px;
  }
  h2 { margin: 0 0 14px; font-size: 20px; font-weight: 600; font-family: Georgia, "Times New Roman", serif; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 8px 10px; text-align: left; vertical-align: middle; }
  th { font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid #efeade; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; }
  th.num { text-align: right; }
  input, select {
    font: inherit; color: var(--ink); width: 100%;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: #fff;
  }
  input[type=number], input.play { text-align: right; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .play { background: var(--input); border-color: var(--input-line); }
  .head { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .logo { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--line); }
  .logo img { width: 100%; height: 100%; display: block; transform: scale(1.12); }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #cRevNow, #cRevSim { padding-right: 9px; }
  th.mid, td.mid { text-align: center; }
  .midhead { max-width: 170px; margin: 0 auto; }
  .result {
    background: var(--accent); color: #fdfbe4; border-radius: 10px;
    padding: 18px 24px; margin: 0 10px 18px; font-family: Georgia, "Times New Roman", serif;
    font-size: 28px; line-height: 1.25; font-weight: 600; min-height: 74px;
    display: flex; align-items: center;
  }
  .block { border: 1px solid var(--line); border-radius: 10px; padding: 14px 0 8px; margin-bottom: 16px; }
  .block.now { background: var(--bg); }
  .block .result { margin-top: 0; }
  .help h2 { margin-top: 26px; }
  .help h3 { margin: 18px 0 8px; font-size: 17px; font-weight: 600; font-family: Georgia, "Times New Roman", serif; color: var(--ink); }
  .help h2:first-child { margin-top: 0; }
  .help p { margin: 0 0 12px; max-width: 70ch; }
  .btn {
    font: inherit; cursor: pointer; border-radius: 6px; padding: 8px 16px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; margin-top: 14px;
  }
  .btn.small {
    margin: 0; padding: 6px 12px; background: #fff; color: var(--muted); border-color: var(--line);
  }
  .btn.small:hover { color: var(--accent); border-color: var(--accent); }
  .group th { text-align: center; color: var(--accent); background: var(--accent-soft); border-bottom: 0; }
  .group th.blank { background: none; }
  .superline { margin-top: 16px; max-width: 320px; }
  .superline label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .plain { padding: 8px 9px; }
  @media (max-width: 700px) {
    .result { font-size: 21px; padding: 14px 16px; min-height: 0; }
    .wrap { padding: 14px 10px 40px; }
    .card { padding: 14px 10px; overflow-x: auto; }
    table { min-width: 640px; }
  }

  /* ---------- Class Attendance tab ---------- */
#pageClasses{--surface:var(--card);--ink2:var(--muted);--ink3:#9a8670;--grid:#efeade;--wash:var(--accent-soft);--dim:.45;
  --s1:#b5532a;--s2:#7a3b69;--s3:#b8860b;--s4:#c8506d;--s5:#8f5200;--other:#8a8780}
#pageClasses .tile .v{font-family:Georgia,"Times New Roman",serif;color:var(--accent)}
#pageClasses .card{margin-bottom:12px}
#pageClasses .pc{background:var(--input);border-color:var(--input-line)}
#pageClasses .sub{margin-top:0}
#pageClasses .sub{color:var(--ink2);margin:0 0 20px}
#pageClasses .filters{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;margin-bottom:20px}
#pageClasses .f{display:flex;flex-direction:column;gap:4px}
#pageClasses .f label,#pageClasses .f .lab{font-size:13px;color:var(--ink2)}
#pageClasses select,#pageClasses button{font:inherit;color:var(--ink)}
#pageClasses .pc{display:flex;align-items:center;height:36px;width:96px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px}
#pageClasses .pc:focus-within{outline:2px solid var(--accent)}
#pageClasses .pc input{border:0;outline:0;background:transparent;width:100%;font:inherit;color:var(--ink);text-align:right;padding:0;-moz-appearance:textfield}
#pageClasses .pc input::-webkit-outer-spin-button,#pageClasses .pc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#pageClasses .pc span{margin-left:2px;color:var(--ink2)}
#pageClasses select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:140px}
#pageClasses .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);height:36px}
#pageClasses .seg button{border:0;background:transparent;padding:0 14px;cursor:pointer;border-right:1px solid var(--line)}
#pageClasses .seg button:last-child{border-right:0}
#pageClasses .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
#pageClasses .seg button:disabled{color:var(--ink3);cursor:not-allowed}
#pageClasses .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
#pageClasses .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
#pageClasses .tile .k{font-size:13px;color:var(--ink2)}
#pageClasses .tile .v{font-size:38px;font-weight:650;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
#pageClasses .tile .d{font-size:13px;color:var(--ink2);min-height:19px}
#pageClasses .head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
#pageClasses .head h2{font-size:16px;margin:0;font-weight:650}
#pageClasses .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 6px;font-size:13px;color:var(--ink2);min-height:20px}
#pageClasses .legend span{display:inline-flex;align-items:center;gap:6px}
#pageClasses .legend i{display:inline-block;width:16px;height:0;border-top:3px solid;border-radius:2px}
#pageClasses .chartwrap{position:relative}
#pageClasses .chartwrap svg{display:block;width:100%;height:auto}
#pageClasses .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.14);min-width:160px;z-index:3;display:none}
#pageClasses .tip .m{color:var(--ink2);margin-bottom:4px}
#pageClasses .tip .r{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.35}
#pageClasses .tip .r i{width:12px;border-top:3px solid;border-radius:2px;flex:none}
#pageClasses .tip .r b{font-variant-numeric:tabular-nums;min-width:44px}
#pageClasses .tip .r span{color:var(--ink2)}
#pageClasses .tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
#pageClasses .tbl th,#pageClasses .tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
#pageClasses .tbl th:first-child,#pageClasses .tbl td:first-child{text-align:left}
#pageClasses .tbl-scroll{overflow-x:auto}
#pageClasses .linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-size:14px}
#pageClasses .linkbtn:hover{text-decoration:underline}
#pageClasses /* class list */
.cl{margin-top:12px}
#pageClasses .cl-row,#pageClasses .cl-hd{display:grid;grid-template-columns:28px minmax(190px,1.3fr) minmax(150px,1fr) 70px 70px 150px;gap:0 12px;align-items:center}
#pageClasses .cl-hd{align-items:end;font-size:13px;color:var(--ink2);padding:0 8px 6px;border-bottom:1px solid var(--line)}
#pageClasses .cl-hd .num,#pageClasses .cl-row .num{text-align:right}
#pageClasses .cl-hd .mid,#pageClasses .cl-row .mid{text-align:center;font-variant-numeric:tabular-nums}
#pageClasses .cl-hd .mid{line-height:1.2}
#pageClasses .cl-row{padding:7px 8px;border-bottom:1px solid var(--grid);cursor:pointer}
#pageClasses .cl-row:hover{background:var(--wash)}
#pageClasses .cl-row.off{opacity:var(--dim)}
#pageClasses .cl-row .nm{display:flex;flex-direction:column;line-height:1.25}
#pageClasses .cl-row .nm small{color:var(--ink2);font-size:12.5px}
#pageClasses .cl-row input{padding:0;border:0;width:16px;height:16px;margin:0;cursor:pointer;accent-color:var(--accent)}
#pageClasses .bar{display:flex;align-items:center;gap:8px}
#pageClasses .bar .tr{flex:1;height:10px;background:var(--grid);border-radius:5px;overflow:hidden}
#pageClasses .bar .fl{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
#pageClasses .bar b{font-weight:500;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
#pageClasses .cl-row .num{font-variant-numeric:tabular-nums}
#pageClasses .cl-row svg{display:block}
#pageClasses .cl-hd .ctl{grid-column:1/-1}
#pageClasses .note{color:var(--ink2);font-size:13px;margin-top:10px}
@media (max-width:820px){#pageClasses .tiles{grid-template-columns:1fr}
#pageClasses .cl-row,#pageClasses .cl-hd{grid-template-columns:24px minmax(150px,1fr) 120px 56px 56px}
#pageClasses .cl-row .spark,#pageClasses .cl-hd .spark{display:none}

}

</style>
</head>

<script>
(function () {
  var PER = { "Weekly": 52, "Fortnightly": 26, "Monthly": 12, "Quarterly": 4, "Annually": 1 };
  var FREQS = Object.keys(PER);
  var KEY = "studio-crunch-v12";

  function fresh() {
    return {
      members: [
        { name: "Legacy", price: 24, freq: "Weekly", people: 13 },
        { name: "New", price: 28, freq: "Weekly", people: 48 },
        { name: "Other", price: 1320, freq: "Annually", people: 1 }
      ],
      expenses: [
        { name: "Rent", price: 2125, freq: "Monthly", newPrice: 0, newEmpty: true },
        { name: "Utilities", price: 400, freq: "Quarterly", newPrice: 0, newEmpty: true },
        { name: "Teachers' pay", price: 1750, freq: "Monthly", newPrice: 0, newEmpty: true, pay: true },
        { name: "Payment app (Stripe)", price: 200, freq: "Quarterly", newPrice: 0, newEmpty: true },
        { name: "Booking app (Punchpass)", price: 130, freq: "Monthly", newPrice: 0, newEmpty: true },
        { name: "Cleaner", price: 80, freq: "Monthly", newPrice: 0, newEmpty: true },
        { name: "Other", price: 200, freq: "Monthly", newPrice: 0, newEmpty: true }
      ],
      superRate: 12,
      sim: ""
    };
  }

  var S = fresh();
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var p = JSON.parse(saved);
      if (p && p.members && p.expenses) S = p;
    }
  } catch (e) {}

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(/[$,\s]/g, "")); return isFinite(n) ? n : 0; }
  function yearly(price, freq) { return num(price) * (PER[freq] || 1); }
  var money = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD", maximumFractionDigits: 0 });
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
  function freqOptions(sel) {
    return FREQS.map(function (f) {
      return '<option' + (f === sel ? ' selected' : '') + '>' + f + '</option>';
    }).join("");
  }
  function excelRoundUp(x) {
    x = Math.round(x * 1e9) / 1e9;
    return x >= 0 ? Math.ceil(x) : Math.floor(x);
  }

  /* ---------- Crunch ---------- */
  function superRows() {
    return S.expenses.map(function (e, i) {
      var name = e.pay ? e.name + " (+" + num(S.superRate) + "% super)" : e.name;
      return { name: name, freq: e.freq, price: num(e.price) * (e.pay ? 1 + num(S.superRate) / 100 : 1), idx: i, mult: e.pay ? 1 + num(S.superRate) / 100 : 1 };
    });
  }

  function resBox(id) { return '<div class="result"><span id="' + id + '"></span></div>'; }
  var COLS = '<colgroup><col style="width:42%"><col style="width:19%"><col style="width:39%"></colgroup>';
  var HEAD = '<thead><tr><th></th><th class="num">Number of members</th><th class="mid"><div class="midhead">Money in annually</div></th></tr></thead>';

  function renderCrunch() {
    var h = '<div class="card"><h2>Money coming in</h2>' +
      '<div class="block now"><table>' + COLS + HEAD + '<tbody>' +
      '<tr><td>Members you have now</td><td class="num"><div class="plain" id="cPeople"></div></td><td class="mid"><div class="plain" id="cRevNow"></div></td></tr>' +
      '</tbody></table></div>' +
      '<div class="block">' + resBox("cRevText") + '<table>' + COLS + HEAD + '<tbody>' +
      '<tr><td>Enter number of members</td><td><input class="play" type="text" inputmode="decimal" id="cSim" value="' + esc(S.sim) + '"></td><td class="mid"><div class="plain" id="cRevSim"></div></td></tr>' +
      '</tbody></table></div>' +
      '<div class="block">' + resBox("cPctText") + '<table>' + COLS + '<tbody>' +
      '<tr><td>Enter the percentage increase you want</td><td colspan="2"><input class="play" type="text" inputmode="decimal" id="cPct" value="' + esc(S.pct == null ? "" : S.pct) + '"></td></tr>' +
      '</tbody></table></div>' +
      '<div class="block">' + resBox("cTargetText") + '<table>' + COLS + '<tbody>' +
      '<tr><td>Enter the amount you want coming in</td><td colspan="2"><input class="play" type="text" inputmode="decimal" id="cTarget" value="' + esc(S.target == null ? "" : S.target) + '"></td></tr>' +
      '</tbody></table></div></div>';

    h += '<div class="card"><h2>Money out</h2>' + resBox("cExtraText") + '<table>' +
      '<colgroup><col style="width:30%"><col style="width:15%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:13%"></colgroup>' +
      '<thead><tr class="group"><th class="blank" colspan="2"></th><th colspan="2">Current</th><th colspan="2">New</th></tr>' +
      '<tr><th>Expense Name</th><th>Payment Frequency</th><th class="num">Price</th><th class="num">Money out per Year</th><th class="num">New Price</th><th class="num">Money out per Year</th></tr></thead><tbody>';
    superRows().forEach(function (r, n) {
      var ex = S.expenses[r.idx];
      h += '<tr data-row="' + n + '"><td>' + esc(r.name) + '</td><td>' + r.freq + '</td>' +
        '<td class="num"><span class="cPrice"></span></td><td class="num"><span class="cYear"></span></td>';
      h += '<td><input class="play newPrice" type="text" inputmode="decimal" data-i="' + r.idx + '" value="' + (ex.newEmpty ? '' : esc(Math.round(num(ex.newPrice) * r.mult * 100) / 100)) + '" data-m="' + r.mult + '"></td>';
      h += '<td class="num"><span class="cNewYear"></span></td></tr>';
    });
    h += '</tbody></table></div>';

    $("pageCrunch").innerHTML = h;

    $("cSim").addEventListener("input", function () { S.sim = this.value; save(); calc(); });
    $("cPct").addEventListener("input", function () { S.pct = this.value; save(); calc(); });
    $("cTarget").addEventListener("input", function () { S.target = this.value; save(); calc(); });
    Array.prototype.forEach.call(document.querySelectorAll(".newPrice"), function (el) {
      el.addEventListener("input", function () {
        var ex = S.expenses[+this.getAttribute("data-i")];
        ex.newEmpty = isEmpty(this.value);
        ex.newPrice = num(this.value) / num(this.getAttribute("data-m"));
        ex.newPriceFollows = false; save(); calc();
      });
    });
    calc();
  }

  function isEmpty(v) { return v == null || !isFinite(parseFloat(String(v).replace(/[$,\s]/g, ""))); }
  function showResult(id, text) {
    $(id).textContent = text;
    $(id).parentNode.style.display = text ? "" : "none";
  }
  function peopleText(n, people) {
    var d = n - people;
    var name = n === 1 ? "member" : "members";
    var tail = d > 0 ? d + " more than now" : d < 0 ? Math.abs(d) + " fewer than now" : "the same as now";
    return "You need " + n + " " + name + ", " + tail;
  }

  function calc() {
    var people = 0, revNow = 0;
    S.members.forEach(function (m) {
      people += num(m.people);
      revNow += yearly(m.price, m.freq) * num(m.people);
    });
    var revPer = people > 0 ? revNow / people : 0;

    $("cPeople").textContent = people;
    $("cRevNow").textContent = money.format(revNow);

    var simEmpty = isEmpty(S.sim);
    var revSim = num(S.sim) * revPer;
    $("cRevSim").textContent = simEmpty ? "" : money.format(revSim);
    var t = "";
    if (revNow > 0 && !simEmpty) {
      var chg = (revSim - revNow) / revNow;
      var pct = Math.round(Math.abs(chg) * 100) + "%";
      if (chg > 0) t = "Your money is up " + pct;
      else if (chg < 0) t = "Your money is down " + pct;
      else t = "Your money has not changed";
    }
    showResult("cRevText", t);

    var pt = "";
    if (revPer > 0 && !isEmpty(S.pct)) {
      var need = revNow * (1 + num(S.pct) / 100);
      var n1 = Math.max(0, Math.ceil(Math.round(need / revPer * 1e9) / 1e9));
      pt = peopleText(n1, people);
    }
    showResult("cPctText", pt);

    var tt = "";
    if (revPer > 0 && !isEmpty(S.target)) {
      var n2 = Math.max(0, Math.ceil(Math.round(num(S.target) / revPer * 1e9) / 1e9));
      tt = peopleText(n2, people);
    }
    showResult("cTargetText", tt);

    var curTotal = 0, newTotal = 0, anyFilled = false;
    var rows = superRows();
    var trs = document.querySelectorAll("tr[data-row]");
    rows.forEach(function (r, n) {
      var tr = trs[n]; if (!tr) return;
      var ex = S.expenses[r.idx];
      var empty = !!ex.newEmpty;
      if (!empty) anyFilled = true;
      var newPrice = empty ? r.price : num(ex.newPrice) * r.mult;
      var cy = yearly(r.price, r.freq), ny = yearly(newPrice, r.freq);
      curTotal += cy; newTotal += ny;
      tr.querySelector(".cPrice").textContent = money.format(r.price);
      tr.querySelector(".cYear").textContent = money.format(cy);
      tr.querySelector(".cNewYear").textContent = empty ? "" : money.format(ny);
    });

    var e = "";
    if (revPer > 0 && anyFilled) {
      var extra = excelRoundUp((revNow + (newTotal - curTotal)) / revPer - people);
      if (extra > 0) e = "You need " + extra + " extra members";
      else if (extra < 0) e = "You can get away with " + Math.abs(extra) + " less members and still pull the same profit as before";
      else e = "No change";
    }
    showResult("cExtraText", e);
  }

  /* ---------- Setup ---------- */
  function renderSetup() {
    var h = '';
    h += '<div class="card"><h2>Types of Membership</h2><table>' +
      '<colgroup><col style="width:30%"><col style="width:16%"><col style="width:20%"><col style="width:20%"><col style="width:14%"></colgroup>' +
      '<thead><tr><th>Types of Membership</th><th class="num">Price</th><th>Frequency</th><th class="num">Number of Members</th><th></th></tr></thead><tbody>';
    S.members.forEach(function (m, i) {
      h += '<tr><td><input type="text" data-k="name" data-i="' + i + '" value="' + esc(m.name) + '"></td>' +
        '<td><input type="number" min="0" step="any" data-k="price" data-i="' + i + '" value="' + esc(m.price) + '"></td>' +
        '<td><select data-k="freq" data-i="' + i + '">' + freqOptions(m.freq) + '</select></td>' +
        '<td><input type="number" min="0" step="1" data-k="people" data-i="' + i + '" value="' + esc(m.people) + '"></td>' +
        '<td class="num"><button class="btn small" data-del="m" data-i="' + i + '">Remove</button></td></tr>';
    });
    h += '</tbody></table><button class="btn" id="addMember">Add membership</button></div>';

    h += '<div class="card"><h2>Money out</h2><table>' +
      '<colgroup><col style="width:42%"><col style="width:20%"><col style="width:24%"><col style="width:14%"></colgroup>' +
      '<thead><tr><th>Expense Name</th><th class="num">Price</th><th>Payment Frequency</th><th></th></tr></thead><tbody>';
    S.expenses.forEach(function (x, i) {
      h += '<tr><td><input type="text" data-k="name" data-i="' + i + '" data-e="1" value="' + esc(x.name) + '"></td>' +
        '<td><input type="number" min="0" step="any" data-k="price" data-i="' + i + '" data-e="1" value="' + esc(x.price) + '"></td>' +
        '<td><select data-k="freq" data-i="' + i + '" data-e="1">' + freqOptions(x.freq) + '</select></td>' +
        '<td class="num"><button class="btn small" data-del="e" data-i="' + i + '">Remove</button></td></tr>';
    });
    h += '</tbody></table>' +
      '<div class="superline"><label for="superRate">Super on teachers\' pay (%)</label>' +
      '<input type="number" min="0" step="any" id="superRate" value="' + esc(S.superRate) + '"></div>' +
      '<button class="btn" id="addExpense">Add expense</button></div>';

    $("pageSetup").innerHTML = h;

    Array.prototype.forEach.call($("pageSetup").querySelectorAll("input[data-k], select[data-k]"), function (el) {
      var evt = el.tagName === "SELECT" ? "change" : "input";
      el.addEventListener(evt, function () {
        var list = this.getAttribute("data-e") ? S.expenses : S.members;
        var row = list[+this.getAttribute("data-i")];
        var k = this.getAttribute("data-k");
        row[k] = this.value;
        if (k === "price" && this.getAttribute("data-e") && row.newPriceFollows) row.newPrice = this.value;
        save();
      });
    });
    Array.prototype.forEach.call($("pageSetup").querySelectorAll("button[data-del]"), function (b) {
      b.addEventListener("click", function () {
        var i = +this.getAttribute("data-i");
        if (this.getAttribute("data-del") === "m") S.members.splice(i, 1); else S.expenses.splice(i, 1);
        save(); renderSetup();
      });
    });
    $("addMember").addEventListener("click", function () {
      S.members.push({ name: "", price: 0, freq: "Weekly", people: 0 });
      save(); renderSetup();
      var rows = $("pageSetup").querySelectorAll('input[data-k="name"]:not([data-e])');
      rows[rows.length - 1].focus();
    });
    $("addExpense").addEventListener("click", function () {
      S.expenses.push({ name: "", price: 0, freq: "Monthly", newPrice: 0, newEmpty: true });
      save(); renderSetup();
      var rows = $("pageSetup").querySelectorAll('input[data-k="name"][data-e]');
      rows[rows.length - 1].focus();
    });
    $("superRate").addEventListener("input", function () { S.superRate = this.value; save(); });
  }

  /* ---------- How to use ---------- */
  function renderHelp() {
    $("pageHelp").innerHTML = '<div class="card help">' +
      '<h2>Setup</h2>' +
      '<p>Start on the Setup tab. You only need to do this once, and again whenever your prices or memberships change.</p>' +
      '<p>Types of Membership: put one row for each membership you sell. Enter its price, how often it is paid, and how many members are on it. Use Add membership for a new one, and Remove to take one off.</p>' +
      '<p>Money out: put one row for each cost of running the studio. Enter what you pay now and how often you pay it. Use Add expense for a new one, and Remove to take one off.</p>' +
      '<p>Super on teachers\' pay: enter the super rate. It is added on top of the teachers\' pay price for you, so enter the pay before super.</p>' +
      '<p>Everything you enter is saved in this browser on this computer, so it will still be here next time you open the tool.</p>' +
      '<h2>How the Numbers Crunch</h2>' +
      '<h3>Money coming in</h3>' +
      '<p>On the first tab, Members you have now and the money next to it come from your Setup.</p>' +
      '<p>There are three boxes to play with. Each one has its own answer, and the answer only shows once you have typed a number in.</p>' +
      '<p>Enter number of members: type how many members you could have. The tool shows how much money would come in over a year, and how much higher or lower that is than now.</p>' +
      '<p>Enter the percentage increase you want: type the percentage. The tool shows how many members you need to get there.</p>' +
      '<p>Enter the amount you want coming in: type a dollar amount for the year. The tool shows how many members you need to get there.</p>' +
      '<p>It works all of this out by giving every member the average yearly payment of your members today.</p>' +
      '<h3>Money out</h3>' +
      '<p>Current shows what you pay now. Type the price you expect to pay into the green box in the New Price column, next to each expense you want to change. Leave the rest as they are. The answer only shows while every New Price box has a number in it.</p>' +
      '<p>The tool then tells you how many extra members you need to pay for the new expenses and keep the same profit as you make now. If your new expenses are lower, it tells you how many members you can lose and still make the same profit.</p>' +
      '<h3>Using the two parts</h3>' +
      '<p>Money coming in and Money out work separately. You can use one or both. The numbers you type in Money coming in do not change the answer in Money out, and the other way around.</p>' +
      '<h2>Class Attendance</h2>' +
      '<p>This tab shows how full your classes have been. It uses your Punchpass class report for the 20 classes you run most often, from May 2025 to 9 November 2026. It does not use the numbers on the Setup tab.</p>' +
      '<p>Full means at least: type the percentage of places that makes a class full for you. With 15 places, 100 means all 15 were taken and 90 means 14 or more. The Classes that were full tile and the % full column in the list use your number.</p>' +
      '<p>The three tiles show the percentage of classes that were full, the average percentage of places taken, and how many classes ran. They change with whatever you choose in Teacher, From, To and the list of classes.</p>' +
      '<p>The chart shows the average percentage of places taken, month by month. Split lines by: Nothing gives one line for all the ticked classes, Class gives one line for each ticked class, and Teacher gives one line for each teacher. When you tick some of the classes but not all, the chart switches to Class by itself. Hover over a month to see the numbers.</p>' +
      '<p>Classes: tick a class, or click its row, to put it on the chart, and do it again to take it off. Select all and Clear all do every class at once. Classes you have not ticked are greyed out but keep their numbers. Each row shows the average percentage of places taken, the percentage of its classes that were full, how many times it ran, and a small line of its monthly averages.</p>' +
      '<p>Teacher, From and To narrow everything to one teacher or a range of months. Reset all filters puts everything back to how it was when you opened the tab.</p>' +
      '<p>A month with no class of that kind shows as a gap. A class with nobody booked counts as 0%.</p>' +
      '</div>';
  }

  /* ---------- Tabs ---------- */
  function show(which) {
    $("pageCrunch").hidden = which !== "crunch";
    $("pageSetup").hidden = which !== "setup";
    $("pageClasses").hidden = which !== "classes";
    $("pageHelp").hidden = which !== "help";
    $("tabCrunch").className = "tab" + (which === "crunch" ? " on" : "");
    $("tabSetup").className = "tab" + (which === "setup" ? " on" : "");
    $("tabClasses").className = "tab" + (which === "classes" ? " on" : "");
    $("tabHelp").className = "tab" + (which === "help" ? " on" : "");
    if (which === "crunch") renderCrunch();
    else if (which === "setup") renderSetup();
    else if (which === "classes") window.renderClassAttendance();
    else renderHelp();
  }
  $("tabCrunch").addEventListener("click", function () { show("crunch"); });
  $("tabSetup").addEventListener("click", function () { show("setup"); });
  $("tabClasses").addEventListener("click", function () { show("classes"); });
  $("tabHelp").addEventListener("click", function () { show("help"); });
  show("crunch");
})();
</script>

function monthStats(rows){
  const by=new Map();
  for(const r of rows){ if(!by.has(r[2])) by.set(r[2],[]); by.get(r[2]).push(r); }
  const out=[]; for(let m=st.from;m<=st.to;m++){ out.push({m, ...stats(by.get(m)||[])}); }
  return out;
}

/* sticky colour slots: an entity keeps its colour while filters change */
const slots={teacher:new Map(),class:new Map()};
function assign(kind,keys){
  const map=slots[kind], used=new Set(), res=new Map();
  for(const k of keys){ if(map.has(k)&&!used.has(map.get(k))){used.add(map.get(k));res.set(k,map.get(k));} }
  let extra=0;
  for(const k of keys){ if(res.has(k)) continue; let got=false; for(let s=0;s<MAXC;s++){ if(!used.has(s)){used.add(s);map.set(k,s);res.set(k,s);got=true;break;} } if(!got){res.set(k,extra%MAXC);extra++;} }
  return res;
}

function buildSeries(){
  const rows=pick();
  if(st.split==='none') return [{name:st.sel.size===D.classes.length?'All classes':'Selected classes', color:'--accent', dash:'', rows}];
  const kind=st.split, idx=kind==='teacher'?1:0;
  const g=new Map(); for(const r of rows){ if(!g.has(r[idx])) g.set(r[idx],[]); g.get(r[idx]).push(r); }
  const keys=[...g.keys()].sort((a,b)=> kind==='teacher'? D.teachers[a].localeCompare(D.teachers[b]) : a-b);
  const sl=assign(kind,keys);
  return keys.map(k=>({name: kind==='teacher'?D.teachers[k]:cname(k), color:SLOTS[sl.get(k)][0], dash:SLOTS[sl.get(k)][1], rows:g.get(k)}));
}

/* ---------- filters ---------- */
function fillSelects(){
  const t=$('fTeacher'); t.innerHTML='';
  const rows=pick({teacher:-1});
  const cnt=new Map(); for(const r of rows) cnt.set(r[1],(cnt.get(r[1])||0)+1);
  const o=document.createElement('option'); o.value=-1; o.textContent='All teachers'; t.appendChild(o);
  [...cnt.keys()].sort((a,b)=>D.teachers[a].localeCompare(D.teachers[b])).forEach(k=>{
    const o=document.createElement('option'); o.value=k; o.textContent=D.teachers[k]; t.appendChild(o);
  });
  if(st.teacher>=0 && !cnt.has(st.teacher)) st.teacher=-1;
  t.value=st.teacher;
  for(const id of ['fFrom','fTo']){
    const s=$(id); if(s.options.length) continue;
    D.months.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m;s.appendChild(o)});
  }
  $('fFrom').value=st.from; $('fTo').value=st.to;
}
$('fTeacher').onchange=e=>{st.teacher=+e.target.value;render()};
$('fFrom').onchange=e=>{st.from=+e.target.value; if(st.to<st.from) st.to=st.from; render()};
$('fTo').onchange=e=>{st.to=+e.target.value; if(st.from>st.to) st.from=st.to; render()};
function wireSeg(id,key){
  $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.disabled) return; st[key]=b.dataset.v; render(); });
}

$('fAll').onclick=()=>{st.sel=new Set(D.classes.map((_,i)=>i));st.teacher=-1;st.from=0;st.to=D.months.length-1;st.split='none';st.measure='avg';st.thr=100;$('fThr').value=100;render()};
$('selAll').onclick=()=>{st.sel=new Set(D.classes.map((_,i)=>i));autoSplit();render()};
wireSeg('fSplit','split');
$('fThr').oninput=e=>{const v=parseFloat(e.target.value); if(isFinite(v)&&v>0&&v<=100){st.thr=v;render(true)}};
$('fThr').onblur=e=>{e.target.value=st.thr};
$('selNone').onclick=()=>{st.sel=new Set();autoSplit();render()};

/* ---------- tiles ---------- */
function renderTiles(){
  const s=stats(pick());
  $('tFull').textContent=pct(s.full,1);
  $('tAvg').textContent=pct(s.avg,0);
  $('tN').textContent=s.n.toLocaleString('en-AU');
}

/* ---------- main chart ---------- */
let geom=null;
function renderChart(series){
  const svg=$('chart'); svg.innerHTML='';
  const W=Math.max(320,$('chartwrap').clientWidth||900), H=series.length>8?460:(W<560?300:360);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const m={l:46,r:26,t:10,b:30}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const months=[]; for(let i=st.from;i<=st.to;i++) months.push(i);
  const key=st.measure;
  const data=series.map(s=>({...s, pts:monthStats(s.rows)}));
  let mx=0; data.forEach(s=>s.pts.forEach(p=>{if(p[key]!=null&&p[key]>mx)mx=p[key]}));
  const step = mx>0.6?0.2:(mx>0.3?0.1:(mx>0.12?0.05:0.02));
  const ymax=Math.max(step*2,Math.ceil(mx*1.05/step)*step);
  const X=i=> months.length===1? m.l+iw/2 : m.l+(i-st.from)/(months.length-1)*iw;
  const Y=v=> m.t+ih-(v/ymax)*ih;
  // grid
  for(let v=0; v<=ymax+1e-9; v+=step){
    const y=Y(v);
    el('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,stroke:css('--grid'),'stroke-width':1},svg);
    const t=el('text',{x:m.l-8,y:y+4,'text-anchor':'end','font-size':11.5,fill:css('--ink3')},svg); t.textContent=pct(v,0);
  }
  el('line',{x1:m.l,x2:W-m.r,y1:Y(0),y2:Y(0),stroke:css('--line'),'stroke-width':1},svg);
  // x labels
  const gap=months.length>1?iw/(months.length-1):iw, every=Math.max(1,Math.ceil(58/gap));
  months.forEach((mi,k)=>{
    if(k%every) return;
    const t=el('text',{x:X(mi),y:H-9,'text-anchor':'middle','font-size':11.5,fill:css('--ink3')},svg);
    t.textContent=D.months[mi].replace(' 20',' ’');
  });
  // lines
  data.forEach(s=>{
    const col=css(s.color); let d='',pen=false;
    s.pts.forEach(p=>{ if(p[key]==null){pen=false;return;} d+=(pen?'L':'M')+X(p.m).toFixed(1)+' '+Y(p[key]).toFixed(1)+' '; pen=true; });
    const pa=el('path',{d,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg); if(s.dash) pa.setAttribute('stroke-dasharray',s.dash);
    s.pts.forEach(p=>{ if(p[key]==null) return;
      el('circle',{cx:X(p.m),cy:Y(p[key]),r:4,fill:col,stroke:css('--surface'),'stroke-width':2},svg); });
  });
  // hover layer
  const hair=el('line',{y1:m.t,y2:Y(0),stroke:css('--ink3'),'stroke-width':1,'stroke-dasharray':'3 3',visibility:'hidden'},svg);
  const hit=el('rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent'},svg);
  const tip=$('tip');
  function move(ev){
    const r=svg.getBoundingClientRect(), sx=W/r.width;
    const px=(ev.clientX-r.left)*sx;
    let k=months.length===1?0:Math.round((px-m.l)/iw*(months.length-1)); k=Math.max(0,Math.min(months.length-1,k));
    const mi=months[k], x=X(mi);
    hair.setAttribute('x1',x); hair.setAttribute('x2',x); hair.setAttribute('visibility','visible');
    tip.innerHTML='';
    const h=document.createElement('div'); h.className='m';
    h.textContent=D.months[mi]+(mi===D.months.length-1?' (to '+D.lastDate+')':''); tip.appendChild(h);
    data.map(s=>({s,p:s.pts[k]})).filter(o=>o.p.n).sort((a,b)=>(b.p[key]??-1)-(a.p[key]??-1)).forEach(({s,p})=>{
      const row=document.createElement('div'); row.className='r';
      const i=document.createElement('i'); i.style.borderColor=css(s.color); i.style.borderTopStyle=s.dash?'dashed':'solid';
      const b=document.createElement('b'); b.textContent=pct(p[key],0);
      const sp=document.createElement('span'); sp.textContent=s.name+' · '+p.n+(p.n===1?' class':' classes');
      row.append(i,b,sp); tip.appendChild(row);
    });
    tip.style.display='block';
    const tw=tip.offsetWidth, left=x/sx+12+tw>r.width? x/sx-tw-12 : x/sx+12;
    tip.style.left=Math.max(0,left)+'px'; tip.style.top='4px';
  }
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerleave',()=>{hair.setAttribute('visibility','hidden');tip.style.display='none'});
  svg.setAttribute('aria-label',$('chTitle').textContent);
  return data;
}

function renderLegend(series){
  const lg=$('legend'); lg.innerHTML='';
  if(series.length<1) return;
  series.forEach(s=>{
    const sp=document.createElement('span'); const i=document.createElement('i'); i.style.borderColor=css(s.color); i.style.borderTopStyle=s.dash?'dashed':'solid';
    sp.appendChild(i); sp.appendChild(document.createTextNode(s.name)); lg.appendChild(sp);
  });
}

function renderTable_unused(data){
  const w=$('tblwrap'); w.innerHTML=''; if(!data.length) return;
  const t=document.createElement('table'); t.className='tbl';
  const hr=t.createTHead().insertRow();
  const th=document.createElement('th'); th.textContent='Month'; hr.appendChild(th);
  data.forEach(s=>{ const h=document.createElement('th'); h.textContent=s.name; hr.appendChild(h); });
  const tb=t.createTBody();
  data[0].pts.forEach((p,k)=>{
    const r=tb.insertRow(); r.insertCell().textContent=D.months[p.m];
    data.forEach(s=>{ const q=s.pts[k]; r.insertCell().textContent=q.n? pct(q[st.measure],1)+' ('+q.n+')':'–'; });
  });
  w.appendChild(t);
}

/* ---------- class list ---------- */
function renderClasses(){
  const box=$('cl'); box.innerHTML='';
  const hd=document.createElement('div'); hd.className='cl-hd';
  ['','Class','Average % of capacity','% full','Classes run','Monthly average'].forEach((t,i)=>{
    const d=document.createElement('div'); d.textContent=t;
    if(i===3) d.className='num'; if(i===4) d.className='mid'; if(i===5) d.className='spark'; hd.appendChild(d);
  });
  box.appendChild(hd);
  // shared scale for the trend lines
  const per=D.classes.map((_,i)=>{
    const rows=pick({classes:new Set([i])});
    return {i, s:stats(rows), ms:monthStats(rows)};
  });
  let smax=0; per.forEach(p=>p.ms.forEach(q=>{ if(q.avg!=null&&q.avg>smax) smax=q.avg; })); smax=Math.max(smax,.2);
  per.sort((a,b)=>(b.s.avg??-1)-(a.s.avg??-1));
  per.forEach(p=>{
    const c=D.classes[p.i];
    const row=document.createElement('div'); row.className='cl-row'+(st.sel.has(p.i)?'':' off');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=st.sel.has(p.i);
    cb.setAttribute('aria-label','Include '+cname(p.i));
    cb.onclick=e=>{e.stopPropagation(); if(cb.checked) st.sel.add(p.i); else st.sel.delete(p.i); autoSplit(); render();};
    const nm=document.createElement('div'); nm.className='nm';
    const a=document.createElement('span'); a.textContent=c.name; const b=document.createElement('small'); b.textContent=c.day+' '+c.time;
    nm.append(a,b);
    const bar=document.createElement('div'); bar.className='bar';
    const tr=document.createElement('div'); tr.className='tr'; const fl=document.createElement('div'); fl.className='fl';
    fl.style.width=Math.min(100,(p.s.avg||0)*100)+'%'; tr.appendChild(fl);
    const bv=document.createElement('b'); bv.textContent=pct(p.s.avg,0); bar.append(tr,bv);
    const f=document.createElement('div'); f.className='num'; f.textContent=pct(p.s.full,0);
    const n=document.createElement('div'); n.className='mid'; n.textContent=p.s.n;
    const sp=document.createElement('div'); sp.className='spark';
    const W=150,H=30, svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`},sp);
    svg.setAttribute('role','img'); svg.setAttribute('aria-label','Monthly average for '+cname(p.i));
    const L=p.ms.length; let d='',pen=false,last=null;
    p.ms.forEach((q,k)=>{ if(q.avg==null){pen=false;return;}
      const x=3+(L===1?(W-6)/2:k/(L-1)*(W-6)), y=H-3-(q.avg/smax)*(H-6);
      d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '; pen=true; last=[x,y]; });
    el('path',{d,fill:'none',stroke:css('--accent'),'stroke-width':1.75,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    if(last) el('circle',{cx:last[0],cy:last[1],r:3,fill:css('--accent'),stroke:css('--surface'),'stroke-width':1.5},svg);
    row.append(cb,nm,bar,f,n,sp);
    row.onclick=()=>{ if(st.sel.has(p.i)) st.sel.delete(p.i); else st.sel.add(p.i); autoSplit(); render(); };
    box.appendChild(row);
  });
}

/* ---------- render ---------- */
function render(){
  fillSelects();
  $('fSplit').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st.split)));
  $('sub').textContent=D.classes.length+' frequent classes · '+D.months[0]+' to '+D.lastDate;
  $('chTitle').textContent=(st.measure==='avg'?'Monthly average percentage of capacity':'Monthly percentage of classes that were full');
  renderTiles();
  const series=buildSeries();
  renderLegend(series);
  const data=renderChart(series);
  renderClasses();
}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(!root.hidden) render(); },120)});
window.renderClassAttendance=render;

})();
</script>
